services:
  postgres:
    # Офіційний образ Postgres із вбудованим розширенням pgvector
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # 🧠 healthcheck + depends_on.condition: API стартує лише тоді,
    # коли БД реально приймає з'єднання, а не просто "контейнер запущено".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    # appendonly: Redis пише зміни на диск і не втрачає черги після рестарту
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # Сервіси нижче — у профілі "app": запускаються лише з --profile app.
  # Для щоденної розробки піднімай тільки postgres + redis, а код запускай локально.
  api:
    profiles: [app]
    build: .
    command: ["node", "dist/main.api.js"]
    environment: &app-env
      DATABASE_URL: postgres://studio:studio@postgres:5432/studio
      REDIS_HOST: redis
      MEDIA_DIR: /media
    ports: ["3000:3000"]
    volumes: [./media:/media]
    depends_on: &deps
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    build: .
    command: ["node", "dist/main.worker.js"]
    environment: *app-env
    volumes: [./media:/media]
    depends_on: *deps
    # Дає воркеру час дорендерити поточний джоб при docker compose stop
    stop_grace_period: 60s

volumes:
  postgres-data:
  redis-data:
